# True color + undercurl
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on

setw -g mode-keys vi

# Secondary prefix: keep C-b, also accept C-Space
set -g prefix2 C-Space
bind C-Space send-prefix -2

# Ctrl-h/j/k/l moves between tmux panes and nvim splits transparently
# (bindings supplied by vim-tmux-navigator plugin; nvim side configured via christoomey/vim-tmux-navigator)

# Prefix-hjkl enters sticky pane-nav mode (no Ctrl needed after)
bind h select-pane -L \; switch-client -T pane-nav
bind j select-pane -D \; switch-client -T pane-nav
bind k select-pane -U \; switch-client -T pane-nav
bind l select-pane -R \; switch-client -T pane-nav

bind -T pane-nav h select-pane -L \; switch-client -T pane-nav
bind -T pane-nav j select-pane -D \; switch-client -T pane-nav
bind -T pane-nav k select-pane -U \; switch-client -T pane-nav
bind -T pane-nav l select-pane -R \; switch-client -T pane-nav

# Sticky resize mode: prefix + R, then hjkl to resize, Escape/q to exit
bind r switch-client -T pane-resize
bind -T pane-resize h resize-pane -L 5 \; switch-client -T pane-resize
bind -T pane-resize j resize-pane -D 3 \; switch-client -T pane-resize
bind -T pane-resize k resize-pane -U 3 \; switch-client -T pane-resize
bind -T pane-resize l resize-pane -R 5 \; switch-client -T pane-resize
bind -T pane-resize H resize-pane -L 20 \; switch-client -T pane-resize
bind -T pane-resize J resize-pane -D 10 \; switch-client -T pane-resize
bind -T pane-resize K resize-pane -U 10 \; switch-client -T pane-resize
bind -T pane-resize L resize-pane -R 20 \; switch-client -T pane-resize
bind -T pane-resize Escape switch-client -T root
bind -T pane-resize q switch-client -T root

# Splits open in the pane's cwd, not tmux's startup cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Zellij-style tiling
bind T select-layout tiled
bind = select-layout -E

# Smart split: side-by-side if pane is wide enough, else top/bottom
bind Enter if -F "#{e|>:#{pane_width},#{e|*:2,#{pane_height}}}" \
  { split-window -h -c "#{pane_current_path}" ; select-layout tiled } \
  { split-window -v -c "#{pane_current_path}" ; select-layout tiled }

# Pane border shows current command + pane index (orientation aid)
set -g pane-border-status top
set -g pane-border-format " #{?#{==:#{pane_index},1},,│ }#{pane_index}: #{pane_current_command} "
set -g pane-border-lines single

# Floating popup overlays (zellij-style)
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind C-p display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Sessionizer: fzf project picker → switch/create tmux session
bind f display-popup -E -w 60% -h 60% "tmux-sessionizer"

# Yank to system clipboard in copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-fzf: bind Tab → fuzzy session/window/pane picker
TMUX_FZF_LAUNCH_KEY="Tab"

# Catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session} #{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text "%H:%M"

# Floax popup (prefix + p)
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'

# Auto-restore sessions across reboots
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.config/tmux/plugins/tpm/tpm'
